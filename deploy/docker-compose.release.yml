# Release deployment: the same stack as docker-compose.yml, but the panel runs from the
# published image instead of a build of this checkout. install.sh downloads this file
# to <install dir>/docker-compose.yml; the services, volumes and healthchecks must stay
# identical to docker-compose.yml (only the panel image line and the caddy profile differ).
#
# PANEL_VERSION picks the image tag (a release number like 1.0.0, or latest).
# PANEL_IMAGE replaces the whole image reference (name:tag) - for mirrors and tests.
# Both are read from .env in this directory.
#
# Caddy sits under the "caddy" profile so that local mode (no domain, no TLS) can leave
# it out:  docker compose --profile caddy up -d   for a domain,
#          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d   locally.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tgwp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tgwp}
      POSTGRES_DB: tgwp
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgwp"]
      interval: 5s
      retries: 10

  panel:
    image: ${PANEL_IMAGE:-ghcr.io/greenpandorik/tgproxy-panel:${PANEL_VERSION:-latest}}
    env_file: .env
    environment:
      DATABASE_URL: postgres://tgwp:${POSTGRES_PASSWORD:-tgwp}@postgres:5432/tgwp?sslmode=disable
      # The paneldata volume. Wins over the bare-metal ./data in .env, which env_file
      # would otherwise push into the container.
      DATA_DIR: /data
    depends_on:
      postgres:
        condition: service_healthy
    volumes: [paneldata:/data]
    expose: ["8080"]
    # /healthz is served only once migrations have run and the HTTP server is listening, so
    # dependants gated on service_healthy never proxy to a half-started panel. wget comes
    # from busybox in the alpine base image; no extra package is needed.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    profiles: [caddy]
    ports: ["80:80", "443:443"]
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      panel:
        condition: service_healthy

volumes:
  pgdata: {}
  paneldata: {}
  caddydata: {}
