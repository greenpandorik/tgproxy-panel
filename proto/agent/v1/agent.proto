syntax = "proto3";
package agent.v1;
option go_package = "tgwebproxy/proto/agent/v1;agentv1";

service AgentGateway {
  rpc Session(stream Envelope) returns (stream Envelope);
}

message Envelope {
  string request_id = 1;
  oneof body {
    Hello hello = 2;
    Heartbeat heartbeat = 3;
    Request request = 4;
    Response response = 5;
    LogChunk log_chunk = 6;
  }
}

message Hello {
  string agent_version = 1;
  string tproxy_version = 2;
  string hostname = 3;
}

message Heartbeat { HealthReport health = 1; }

message HealthReport {
  bool relay_active = 1;
  bool mtproxy_active = 2;
  bool caddy_active = 3;
  bool healthz = 4;
  bool readyz = 5;
  string tproxy_version = 6;
  string agent_version = 7;
  int64 uptime_seconds = 8;
  double cpu_percent = 9;
  double mem_used_percent = 10;
  double disk_used_percent = 11;
  int32 profile_count = 12;

  repeated DcLatency dcs = 13;
  bool upstream_healthy = 14;
  int32 upstream_fails = 15;
  double effective_latency_ms = 16;
  int64 connect_success_total = 17;
  int64 connect_fail_total = 18;
  int64 upstream_last_check_age_secs = 19;
  bool dc_data_available = 20;

  // web is the WEB transport telemetry; absent when the agent could not read it. An agent
  // that never sets it and a panel that never reads it both keep working.
  WebTelemetry web = 21;
  // capabilities is what the agent worked out the node's telemt can do; absent when the
  // probe did not run or could not reach telemt.
  TelemtCapabilities capabilities = 22;
}

// WebCounterSample is one Prometheus sample of a telemt_web_* family. carrier, label and phase
// are the family's own labels and are empty for a family that does not carry them.
message WebCounterSample {
  string carrier = 1;
  string label = 2;
  string phase = 3;
  double value = 4;
}

// WebCounterFamily is one metric family. The message itself is the presence flag: a family the
// node did not expose is a nil WebCounterFamily, never an empty one, so "not reported" can
// never be read as zero. A present family with no samples is a family telemt declared but has
// not yet incremented.
message WebCounterFamily { repeated WebCounterSample samples = 1; }

message WebLearningState {
  bool enabled = 1;
  uint64 policy_generation = 2;
  uint64 epoch = 3;
  int32 entries = 4;
  int32 capacity = 5;
  int64 lifetime_secs = 6;
  int64 health_secs = 7;
  int64 age_ms = 8;
}

message WebDrainState {
  string operation_id = 1;
  string state = 2;
  string outcome = 3;
  int32 timeout_secs = 4;
  int64 started_epoch_millis = 5;
  int64 deadline_epoch_millis = 6;
  uint64 remaining_sessions = 7;
  uint64 remaining_streams = 8;
  uint64 remaining_websockets = 9;
  bool force_close_signalled = 10;
}

message WebLifecycleState {
  string state = 1;
  uint64 epoch = 2;
  int64 age_ms = 3;
  bool admission_open = 4;
  bool effective_new_work_admission = 5;
  WebDrainState drain = 6;
}

// WebRuntimeState is GET /v1/runtime/web/status as the agent read it. learning and lifecycle
// are nil when telemt's payload carried no such section.
message WebRuntimeState {
  string runtime_instance = 1;
  bool carrier_negotiation = 2;
  WebLearningState learning = 3;
  WebLifecycleState lifecycle = 4;
}

// WebTelemetry carries the telemt_web_* families and the WEB runtime state of one node.
// Every family is a nullable message: nil means the node did not report it.
message WebTelemetry {
  WebCounterFamily carrier_selections = 1;
  WebCounterFamily carrier_failures = 2;
  WebCounterFamily learning_outcomes = 3;
  WebCounterFamily learning_entries = 4;
  WebCounterFamily rejections = 5;
  WebCounterFamily session_closures = 6;
  WebCounterFamily bridge_recovery = 7;
  WebRuntimeState runtime = 8;
}

// TelemtCapabilities is the capability set the agent computed. supported holds only the
// capabilities it settled; undetermined names the ones it could not, which the panel must keep
// distinguishable from a capability the node answered "no" to.
message TelemtCapabilities {
  map<string, bool> supported = 1;
  repeated string undetermined = 2;
  string build = 3;
}

// DcLatency is one Telegram datacenter as telemt's upstream health check sees it.
message DcLatency {
  int32 dc = 1;
  double latency_ms = 2;
  bool known = 3;
  string ip_preference = 4;
}

message ProfileLimits {
  int32 max_sessions = 1;
  int32 max_streams = 2;
  int32 max_backend_dials_in_flight = 3;
  int32 new_sessions_per_minute = 4;
  int32 new_sessions_burst = 5;
  int32 new_streams_per_minute = 6;
  int32 new_streams_burst = 7;
  int32 max_streams_per_session = 8;
  int32 max_pending_per_session = 9;
}

message Profile {
  string name = 1;
  string secret = 2;
  string backend = 3;
  string carrier_mode = 4;
  ProfileLimits limits = 5;

  uint64 data_quota_bytes = 10;
  uint64 rate_limit_up_bps = 11;
  uint64 rate_limit_down_bps = 12;
  uint32 max_unique_ips = 13;
  uint32 max_tcp_conns = 14;
  int64 expires_at_unix = 15;
  bool enabled = 16;
}

message ProfilesFile { repeated Profile profiles = 1; }

// WebTimeouts mirrors telemt's [web.timeouts]. Every value is required: the message only
// travels inside a WebPolicy, and a WebPolicy present at all means the panel has an opinion
// on every one of these.
message WebTimeouts {
  repeated int32 negotiation_deadlines_secs = 1;
  int32 carrier_health_secs = 2;
  int32 carrier_learning_secs = 3;
  int32 bridge_request_secs = 4;
  int32 bridge_retry_secs = 5;
  int32 probe_coalesce_ms = 6;
}

// WebPolicy is telemt's carrier negotiation and learning policy as the panel owns it.
message WebPolicy {
  string carrier = 1;
  repeated string carriers = 2;
  bool carrier_learning = 3;
  string aggressiveness = 4;
  WebTimeouts timeouts = 5;
}

message SiteFile { string path = 1; bytes content = 2; }
message SiteBundle { repeated SiteFile files = 1; }

message Request {
  oneof body {
    HealthRequest health = 1;
    GetProfilesRequest get_profiles = 2;
    ApplyRequest apply = 3;
    GetSiteRequest get_site = 4;
    MetricsRequest metrics = 5;
    StatsRequest stats = 6;
    TailLogsRequest tail_logs = 7;
    RestartRelayRequest restart_relay = 8;
  }
}
message HealthRequest {}
message GetProfilesRequest {}
message ApplyRequest {
  bool apply_profiles = 1;
  repeated Profile profiles = 2;
  repeated string mtproxy_secrets = 3;
  SiteBundle site = 4;   // nil = leave site untouched

  string tls_domain = 5;
  uint32 classic_port = 6;
  string public_ip = 7;
  string ad_tag = 8;
  WebPolicy web_policy = 9;   // nil = leave the node's WEB policy untouched
}
message GetSiteRequest {}
message MetricsRequest {}
message StatsRequest {}
message TailLogsRequest { repeated string services = 1; int32 lines = 2; bool follow = 3; }
message RestartRelayRequest {}

message Response {
  string error = 1;
  oneof body {
    HealthReport health = 2;
    ProfilesFile profiles = 3;
    ApplyResult apply = 4;
    SiteBundle site = 5;
    MetricsText metrics = 6;
    StatsMap stats = 7;
    Empty empty = 8;
  }
}
message ApplyResult {
  bool ok = 1;
  bool restarted_relay = 2;
  bool restarted_mtproxy = 3;
  bool rolled_back = 4;
  string log = 5;
  // deferred_fields are config keys telemt persisted but did not activate; restart_required
  // says telemt wants a process restart before they take effect. Both are reported rather
  // than acted on: a proxy node is not restarted behind the operator's back.
  repeated string deferred_fields = 6;
  bool restart_required = 7;
}
message MetricsText { string text = 1; }
message StatsMap { map<string, string> values = 1; }
message Empty {}

message LogLine { string service = 1; string line = 2; int64 unix_ms = 3; }
message LogChunk { repeated LogLine lines = 1; bool done = 2; string error = 3; }
