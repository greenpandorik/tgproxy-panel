name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tgwp
          POSTGRES_PASSWORD: tgwp
          POSTGRES_DB: tgwp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tgwp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build SPA (embedded into the panel binary)
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Format
        run: |
          go install mvdan.cc/gofumpt@v0.11.0
          out="$($(go env GOPATH)/bin/gofumpt -l ./cmd ./internal ./deploy)"
          if [ -n "$out" ]; then echo "$out"; echo "gofumpt: files need formatting"; exit 1; fi
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://tgwp:tgwp@localhost:5432/tgwp_test?sslmode=disable
        run: go test -p 1 -race ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run i18n:check
      - run: npm run build

  image:
    name: Docker image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.panel
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
