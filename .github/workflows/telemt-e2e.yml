name: Real telemt regression

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: telemt-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  telemt:
    name: Pinned engine apply, quota and reconnect
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          bash -n deploy/run-e2e-telemt.sh deploy/e2e-smoke-telemt.sh
          shellcheck deploy/run-e2e-telemt.sh deploy/e2e-smoke-telemt.sh
      - name: Exercise the real pinned telemt and agent
        # Downloads the official checksum-verified musl archive and connects to
        # Telegram upstreams. Deliberately outside the network-independent PR gate.
        run: make e2e-telemt
