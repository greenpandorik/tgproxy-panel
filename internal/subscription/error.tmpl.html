<!doctype html>
<html lang="ru" data-theme="{{if eq .Theme "light"}}light{{else}}dark{{end}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{.PanelName}}</title>
<style>
  :root {
    --bg: #151f2c;
    --surface: #1d2939;
    --border: rgba(255, 255, 255, 0.12);
    --text: #edf2f7;
    --text-dim: #a6b3c4;
  }
  html[data-theme="light"] {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --border: rgba(0, 0, 0, 0.14);
    --text: #182433;
    --text-dim: #526478;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 420px;
    margin: 20px;
    padding: 28px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-align: center;
  }
  .mark {
    width: 22px;
    height: 22px;
    color: var(--text);
    margin-bottom: 12px;
  }
  h1 {
    font-size: 1.05rem;
    font-weight: 650;
    margin: 0 0 8px;
  }
  p {
    color: var(--text-dim);
    font-size: 0.88rem;
    margin: 0;
    line-height: 1.45;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.75L22.25 12 12 22.25 1.75 12Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><rect x="9" y="9" width="6" height="6" rx="1" fill="#e23c92"/></svg>
    <h1>{{.PanelName}}</h1>
    <p>{{.Message}}</p>
  </div>
</body>
</html>
