<!doctype html>
<html lang="{{if .Lang}}{{.Lang}}{{else}}ru{{end}}" data-theme="{{if eq .Theme "light"}}light{{else}}dark{{end}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{.PanelName}}</title>
<style>
  :root {
    --bg: #171b21;
    --surface: #1b2026;
    --border: #3c434c;
    --text: #e9edf1;
    --text-dim: #9ba4ae;
    --mark: #3fc0d6;
  }
  html[data-theme="light"] {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --border: #cfd6de;
    --text: #1b2330;
    --text-dim: #5b6673;
    --mark: #0b7285;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 420px;
    margin: 20px;
    padding: 28px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-align: center;
  }
  .mark {
    width: 22px;
    height: 22px;
    color: var(--text);
    margin-bottom: 12px;
  }
  h1 {
    font-size: 1.05rem;
    font-weight: 650;
    margin: 0 0 8px;
  }
  p {
    color: var(--text-dim);
    font-size: 0.88rem;
    margin: 0;
    line-height: 1.45;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.6 9.7c0-1.9 1.4-2.9 3.2-2.9h12.4c1.8 0 3.2 1 3.2 2.9 0 4.2-2.4 7.6-5.5 7.6-1.9 0-3-1.3-3.9-2.8-.9 1.5-2 2.8-3.9 2.8-3.1 0-5.5-3.4-5.5-7.6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><ellipse cx="8.1" cy="11.5" rx="1.9" ry="1.4" fill="var(--mark)"/><ellipse cx="15.9" cy="11.5" rx="1.9" ry="1.4" fill="var(--mark)"/></svg>
    <h1>{{.PanelName}}</h1>
    <p>{{.Message}}</p>
  </div>
</body>
</html>
